# This workflow will build a Java project with Ant
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-ant

name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 25
      uses: actions/setup-java@v3
      with:
        java-version: '25'
        distribution: 'microsoft'

    - name: Build game with Ant
      run: ant -noinput -buildfile JavaGoldenAxe/build.xml

    - name: Build animation editor with Ant
      run: ant -noinput -buildfile JavaGoldenAxeAnimationEditor2/build.xml
        
